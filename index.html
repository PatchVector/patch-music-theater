#patch-gown-theater .pg-player-frame:before{top:-2px;left:-2px;border-top:2px solid #e0b769;border-left:2px solid #e0b769;border-radius:12px 0 0 0}
#patch-gown-theater .pg-player-frame:after{bottom:-2px;right:-2px;border-bottom:2px solid #54e5ee;border-right:2px solid #54e5ee;border-radius:0 0 12px 0}
#patch-gown-theater iframe{width:100%;height:190px;border:0;border-radius:9px;display:block;background:#24282d}
#patch-gown-theater .pg-player-note{font-size:9px;letter-spacing:.7px;color:#e1c485;margin:5px 0 8px}
#patch-gown-theater .pg-quote{font-family:Georgia,serif;font-size:12px;font-style:italic;color:#e5c78a;margin:12px 0 2px;line-height:1.45}
#patch-gown-theater .pg-foot{font-size:9px;color:#70cbd6;letter-spacing:1px;border-top:1px solid #314b59;padding-top:9px;margin-top:11px}
@media(prefers-reduced-motion:reduce){#patch-gown-theater .pg-stage img{animation:none}#patch-gown-theater .pg-stage img:first-child{opacity:1}}
