<style>
html,body{margin:0;min-height:100%;background:#071824;color:#f6e5bc}
body{font-family:Arial,sans-serif}
#patch-gown-theater{box-sizing:border-box;width:100%;max-width:100%;overflow:hidden;background:linear-gradient(160deg,#071827,#0b1a2a);border:1px solid #d3ae68;border-radius:16px;padding:12px;color:#f6e5bc;font-family:Arial,sans-serif;text-align:center}
#patch-gown-theater *{box-sizing:border-box}
#patch-gown-theater .pg-head{font-size:10px;letter-spacing:1.3px;color:#e4c681;font-weight:bold;margin:2px 0 10px}
#patch-gown-theater .pg-stage{width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;border:1px solid #28667c;border-radius:11px;background:#061423}
#patch-gown-theater .pg-stage img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:patchGownFade 32s linear infinite;will-change:opacity,transform}
#patch-gown-theater .pg-stage img:nth-child(1){animation-delay:0s}
#patch-gown-theater .pg-stage img:nth-child(2){animation-delay:8s}
#patch-gown-theater .pg-stage img:nth-child(3){animation-delay:16s}
#patch-gown-theater .pg-stage img:nth-child(4){animation-delay:24s}
/* A new scene appears at its 8-second boundary while the previous scene fades out. */
@keyframes patchGownFade{0%{opacity:1;transform:scale(1.025)}22%{opacity:1}25%{opacity:0;transform:scale(1.085)}100%{opacity:0}}
#patch-gown-theater .pg-shade{position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(3,13,24,.85));pointer-events:none}
#patch-gown-theater .pg-name{position:absolute;bottom:12px;left:12px;right:12px;text-align:left;font-size:17px;font-weight:800;line-height:1.15;color:#ffe8b5;text-shadow:0 1px 6px #07121b}
#patch-gown-theater .pg-sub{color:#56e2ed;font-size:9px;letter-spacing:.8px;margin-top:5px}
#patch-gown-theater .pg-tag{font-size:9px;letter-spacing:1px;color:#59dce9;margin:11px 0 8px}
#patch-gown-theater .pg-player-note{font-size:9px;letter-spacing:.7px;color:#e1c485;margin:5px 0 8px}
#patch-gown-theater .pg-quote{font-family:Georgia,serif;font-size:12px;font-style:italic;color:#e5c78a;margin:12px 0 2px;line-height:1.45}
#patch-gown-theater .pg-foot{font-size:9px;color:#70cbd6;letter-spacing:1px;border-top:1px solid #314b59;padding-top:9px;margin-top:11px}
@media screen and (min-width:900px){#patch-gown-theater{width:760px;max-width:calc(100% - 40px);margin:20px auto}}
/* PATCH GEOMETRY SOUND ENGINE — compact horizontal music bar */
#patch-gown-theater .pg-player-frame{position:relative;border-radius:14px;border:1px solid rgba(91,229,237,.60);background:linear-gradient(125deg,#102a38,#071522 58%,#1a2730);box-shadow:inset 0 1px 0 rgba(255,232,181,.12),0 0 17px rgba(52,195,212,.10);padding:9px 12px 8px;overflow:hidden}
#patch-gown-theater .pg-player-frame:before,#patch-gown-theater .pg-player-frame:after{content:"";position:absolute;width:20px;height:20px;pointer-events:none}
#patch-gown-theater .pg-player-frame:before{top:0;left:0;border-top:2px solid #e0b769;border-left:2px solid #e0b769;border-radius:13px 0 0 0}
#patch-gown-theater .pg-player-frame:after{bottom:0;right:0;border-bottom:2px solid #54e5ee;border-right:2px solid #54e5ee;border-radius:0 0 13px 0}
#patch-gown-theater .pg-geometry-row{display:flex;align-items:center;gap:10px;min-height:83px}
#patch-gown-theater .pg-transport{flex:0 0 44px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;color:#ffe3a3;background:radial-gradient(circle at 28% 20%,#2a4850,#0b2230 68%);border:1px solid #d9b66d;border-radius:12px;box-shadow:0 0 10px rgba(84,229,238,.16),inset 0 0 12px rgba(224,183,105,.12);font-size:20px;line-height:1;transition:box-shadow .2s,transform .2s}
#patch-gown-theater .pg-transport:hover{box-shadow:0 0 18px rgba(84,229,238,.4);transform:translateY(-1px)}
#patch-gown-theater .pg-transport:focus-visible,#patch-gown-theater .pg-mute:focus-visible,#patch-gown-theater .pg-seek:focus-visible{outline:2px solid #fff1c8;outline-offset:3px}
#patch-gown-theater .pg-geometry-area{min-width:0;flex:1}
#patch-gown-theater .pg-geometry-svg{display:block;width:100%;height:76px;overflow:hidden}
#patch-gown-theater .pg-geometry-svg .pg-glyph{filter:drop-shadow(0 0 5px rgba(91,229,237,.50))}
#patch-gown-theater .pg-timeline{display:flex;align-items:center;gap:9px;margin-top:2px}
#patch-gown-theater .pg-time{font-size:10px;min-width:30px;color:#d5c69d;font-variant-numeric:tabular-nums}
#patch-gown-theater .pg-time:last-of-type{text-align:right}
#patch-gown-theater .pg-seek{--played:0%;flex:1;min-width:0;appearance:none;-webkit-appearance:none;height:4px;border:0;border-radius:99px;cursor:pointer;background:linear-gradient(to right,#e4bc73 0%,#58dce9 var(--played),#36505b var(--played),#36505b 100%)}
#patch-gown-theater .pg-seek::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#ffe1a1;border:2px solid #48cdd9;box-shadow:0 0 8px #4ed9e977}
#patch-gown-theater .pg-seek::-moz-range-thumb{width:8px;height:8px;border-radius:50%;background:#ffe1a1;border:2px solid #48cdd9}
#patch-gown-theater .pg-mute{flex:0 0 27px;width:27px;height:30px;display:grid;place-items:center;cursor:pointer;color:#6fe0e8;background:transparent;border:0;font-size:17px}
#patch-gown-theater .pg-status{min-height:12px;color:#72cbd3;font-size:9px;letter-spacing:.55px;margin-top:3px}
#patch-gown-theater audio{display:none}

  function decodeBand(encoded){
    const raw=atob(encoded), result=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)result[i]=raw.charCodeAt(i);
    return result;
  }
  const bands=songBands.map(decodeBand);
  const dancers=[];
  let nextShape=0, frame=0, lastTime=0, lastBeat=-1, beatCursor=0;
  let bassLevel=0, midLevel=0, highLevel=0;
  const routes=[
    {x0:100,y0:58,x1:340,y1:48},
    {x0:600,y0:49,x1:350,y1:62},
    {x0:185,y0:72,x1:445,y1:45},
    {x0:520,y0:40,x1:275,y1:65},
    {x0:125,y0:45,x1:355,y1:60},
    {x0:570,y0:67,x1:345,y1:45}
  ];
  function addDancer(){
    const i=nextShape++;
    const route=routes[i%routes.length];
    const g=document.createElementNS(svgNS,'g');
    g.setAttribute('class','pg-glyph');
    g.setAttribute('stroke',i%2?'url(#pgGeometryCyan)':'url(#pgGeometryGold)');
    g.setAttribute('stroke-width','2.1');
    g.setAttribute('stroke-linecap','round');
    g.setAttribute('stroke-linejoin','round');
    g.setAttribute('fill','none');
    g.innerHTML=shapes[i%shapes.length];
    glyphContainer.appendChild(g);
    dancers.push({g,route,age:0,duration:2.3,phase:i*.79});
  }
  function actualSound(time){
    const f=Math.max(0,Math.min(bands[0].length-1,Math.floor(time/songStep)));
    return {bass:bands[0][f]/255,mid:bands[1][f]/255,high:bands[2][f]/255};
  }
  function syncBeats(time){
    // Seek-safe: find the first beat after the current playhead position.
    if(lastBeat>time+.05 || time-lastBeat>3.0){
      let low=0,high=songBeats.length;
      while(low<high){const m=(low+high)>>1;if(songBeats[m]<time-.15)low=m+1;else high=m;}
      beatCursor=low;
    }
    lastBeat=time;
    let fired=false;
    while(beatCursor<songBeats.length && songBeats[beatCursor]<=time+.04){
      if(songBeats[beatCursor]>=time-.18)fired=true;
      beatCursor++;
    }
    return fired;
  }
  function timeLabel(value){
    if(!Number.isFinite(value))return '0:00';
    const sec=Math.max(0,Math.floor(value));
    return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  }
  function updateProgress(){
    const total=Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:146;
    current.textContent=timeLabel(audio.currentTime);
    if(Number.isFinite(audio.duration))duration.textContent=timeLabel(audio.duration);
    const value=Math.min(1000,Math.max(0,Math.round(audio.currentTime/total*1000)));
    seek.value=String(value);
    seek.style.setProperty('--played',(value/10)+'%');
  }
  function render(now){
    if(audio.paused||audio.ended){frame=0;return;}
    const dt=lastTime?Math.min((now-lastTime)/1000,.06):0;
    lastTime=now;
    const time=audio.currentTime||0;
    const energy=actualSound(time);
    bassLevel+=(energy.bass-bassLevel)*.35;
    midLevel+=(energy.mid-midLevel)*.3;
    highLevel+=(energy.high-highLevel)*.3;
    // Real transients in the MP3 cue the entrances; only one featured shape.
    const onBeat=syncBeats(time);
    if(onBeat && dancers.length===0){addDancer();}
    for(let i=dancers.length-1;i>=0;i--){
      const d=dancers[i];
      d.age+=dt;
      const p=Math.min(1,d.age/d.duration);
      const ease=p*p*(3-2*p);
      const r=d.route;
      const x=r.x0+(r.x1-r.x0)*ease;
      // Travel follows the song; bass and melody change the shape's size and lift.
      const y=r.y0+(r.y1-r.y0)*ease-8*bassLevel+4*midLevel;
      const scale=1.2+.65*bassLevel+.24*midLevel;
      const rotation=(p-.5)*14+highLevel*7;
      const fade=Math.min(1,p*7,(1-p)*6);
      d.g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rotation.toFixed(1)}) scale(${scale.toFixed(2)})`);
      d.g.setAttribute('opacity',Math.max(0,fade).toFixed(2));
      d.g.setAttribute('stroke-width',(1.8+midLevel*.9).toFixed(2));
      if(p>=1){d.g.remove();dancers.splice(i,1);}
    }
    frame=requestAnimationFrame(render);
  }
  function clearDancers(){
    for(const d of dancers)d.g.remove();
    dancers.length=0;
    lastBeat=-1;
    lastTime=0;
  }
  function updateState(){
    const active=!audio.paused&&!audio.ended;
    play.textContent=active?'Ⅱ':'▶';
    play.setAttribute('aria-label',active?'Pause song':'Play song');
    play.setAttribute('aria-pressed',String(active));
    status.textContent=active?'GEOMETRY • MOVING TO THE REAL SONG':'GEOMETRY • READY TO DANCE';
    cancelAnimationFrame(frame);
    frame=0;
    lastTime=0;
    if(active){frame=requestAnimationFrame(render);}
    else{clearDancers();}
  }
  play.addEventListener('click',async()=>{
    if(!audio.paused){audio.pause();return;}
    // Keep the MP3 connected directly to the browser speakers.
    // Routing cross-origin audio through Web Audio can silently mute it.
    try{
      const started=audio.play(); // Begin inside the user's tap for iPhone Safari.
      await started;
    }catch(err){
      console.error('Audio playback failed',err);
      status.textContent='MUSIC COULD NOT START — OPEN THE ONLINE THEATER OR CHECK INTERNET';
    }
  });
  mute.addEventListener('click',()=>{
    audio.muted=!audio.muted;
    mute.textContent=audio.muted?'×':'♫';
    mute.setAttribute('aria-label',audio.muted?'Unmute song':'Mute song');
    mute.setAttribute('aria-pressed',String(audio.muted));
  });
  seek.addEventListener('input',()=>{
    const total=Number.isFinite(audio.duration)?audio.duration:146;
    audio.currentTime=total*Number(seek.value)/1000;
    updateProgress();
  });
  audio.addEventListener('loadedmetadata',updateProgress);
  audio.addEventListener('durationchange',updateProgress);
  audio.addEventListener('timeupdate',updateProgress);
  audio.addEventListener('play',updateState);
  audio.addEventListener('pause',updateState);
  audio.addEventListener('ended',()=>{updateState();updateProgress();});
  audio.addEventListener('error',()=>{status.textContent='MP3 COULD NOT LOAD — CHECK INTERNET OR OPEN ONLINE';});
  audio.addEventListener('waiting',()=>{if(!audio.paused)status.textContent='LOADING MUSIC…';});
  audio.addEventListener('playing',()=>{status.textContent='GEOMETRY • MOVING TO THE REAL SONG';});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){cancelAnimationFrame(frame);frame=0;lastTime=0;}
    else if(!audio.paused){cancelAnimationFrame(frame);frame=requestAnimationFrame(render);}
  });
  updateProgress();
  updateState();
})();
